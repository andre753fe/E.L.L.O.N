name: Agenda (calendário)
on:
  push:
    paths: ["data/eventos.json", "tools/agenda_ics.py"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/agenda_ics.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add agenda.ics
          git diff --cached --quiet || (git commit -m "Atualiza agenda.ics" && git push)
