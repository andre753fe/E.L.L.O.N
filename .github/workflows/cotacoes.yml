name: Cotações do site
on:
  push:
    paths: ["tools/quotes.py"]
  schedule:
    - cron: "5 8 * * 1-5"
    - cron: "35 14 * * 1-5"
    - cron: "10 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: dados, cancel-in-progress: false }
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/quotes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          git diff --cached --quiet || (git commit -m "Cotações automáticas" && git pull --rebase -q && git push)
